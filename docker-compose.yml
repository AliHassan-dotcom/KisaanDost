version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kisaandost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kisaan_dost}
      POSTGRES_USER: ${DB_USER:-kisaan_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kisaan_secure_pass_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kisaan_user} -d ${DB_NAME:-kisaan_dost}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: kisaandost-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-kisaan_user}:${DB_PASSWORD:-kisaan_secure_pass_2026}@postgres:5432/${DB_NAME:-kisaan_dost}
      USE_DATABASE: "true"
      ENVIRONMENT: "production"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-env}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./app_data:/app/app_data
      - ./Kisaan_Dost_Data:/app/Kisaan_Dost_Data

volumes:
  postgres_data:
