<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kisaan Dost - Market Rates</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Kisaan Dost</h1>
      <select id="lang" class="lang-select" aria-label="Language">
        <option value="en">English</option>
        <option value="ur">اردو</option>
      </select>
    </header>
    <div class="card">
      <h2 data-i18n="market">Market Rates</h2>
      <form id="marketForm">
        <label>Crop</label>
        <input type="text" id="crop" value="wheat">
        <label>District</label>
        <input type="text" id="district" value="Lahore">
        <button type="submit" class="btn" data-i18n="submit">Submit</button>
      </form>
      <div id="result"></div>
    </div>
  </main>

  <script src="/static/js/app.js"></script>
  <script>
    renderNav("scan");
    document.getElementById("marketForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const crop = document.getElementById("crop").value;
      const district = document.getElementById("district").value;
      const resp = await apiFetch(`/market/summary?crop=${encodeURIComponent(crop)}&district=${encodeURIComponent(district)}`);
      if (!resp) return;
      const data = await resp.json();
      const r = data.data;
      document.getElementById("result").innerHTML = `
        <div class="card">
          ${statusPill(r.status, true)}
          <div class="value-grid">
            <div class="value"><div class="label">Crop</div><div class="number">${r.crop}</div></div>
            <div class="value"><div class="label">Price (${r.unit})</div><div class="number">${r.current_price}</div></div>
            <div class="value"><div class="label">Trend</div><div class="number">${r.trend}</div></div>
            <div class="value"><div class="label">District</div><div class="number">${r.district}</div></div>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
