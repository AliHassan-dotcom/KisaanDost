<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kisaan Dost - Scan Crop</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Kisaan Dost</h1>
      <select id="lang" class="lang-select" aria-label="Language">
        <option value="en">English</option>
        <option value="ur">اردو</option>
      </select>
    </header>
    <div class="card">
      <h2 data-i18n="scanCrop">Scan crop</h2>
      <form id="scanForm">
        <input type="file" id="image" accept="image/jpeg,image/png" required>
        <button type="submit" class="btn" data-i18n="submit">Submit</button>
      </form>
      <div id="result"></div>
    </div>
    <div class="card" id="historyCard" style="display:none;">
      <h2>Recent scans</h2>
      <div id="history"></div>
    </div>
  </main>

  <script src="/static/js/app.js"></script>
  <script>
    renderNav("scan");
    document.getElementById("scanForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = document.getElementById("image").files[0];
      if (!file) return;
      const form = new FormData();
      form.append("image", file);
      const resp = await apiFetch("/crop-health/scan", {
        method: "POST",
        body: form,
      });
      if (!resp) return;
      const data = await resp.json();
      const container = document.getElementById("result");
      if (resp.ok) {
        const r = data.data;
        container.innerHTML = `
          <div class="card">
            <span class="status-pill ${r.uncertain ? 'status-uncertain' : 'status-live'}">${r.predicted_class}</span>
            <div class="value-grid">
              <div class="value"><div class="label">Confidence</div><div class="number">${r.confidence}</div></div>
              <div class="value"><div class="label">Model</div><div class="number">${r.model_version}</div></div>
            </div>
            ${r.warning ? `<p class="error">${r.warning}</p>` : ""}
          </div>
        `;
        loadHistory();
      } else {
        showError(container, data.detail || data.error?.message);
      }
    });
    async function loadHistory() {
      const resp = await apiFetch("/crop-health/history");
      if (!resp || !resp.ok) return;
      const scans = (await resp.json()).data;
      if (scans.length === 0) return;
      document.getElementById("historyCard").style.display = "block";
      document.getElementById("history").innerHTML = scans.slice(0, 5).map(s => `
        <div class="value" style="margin-bottom:8px;">
          <div class="number">${s.predicted_class}</div>
          <div class="label">${s.scanned_at}</div>
        </div>
      `).join("");
    }
    loadHistory();
  </script>
</body>
</html>
