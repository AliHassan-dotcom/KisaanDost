<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kisaan Dost - Settings</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Kisaan Dost</h1>
      <select id="lang" class="lang-select" aria-label="Language">
        <option value="en">English</option>
        <option value="ur">اردو</option>
      </select>
    </header>
    <div class="card">
      <h2 data-i18n="settings">Settings</h2>
      <label>Language / زبان</label>
      <select id="language">
        <option value="en">English</option>
        <option value="ur">اردو</option>
      </select>
      <a class="btn" href="/profile.html" style="display:inline-block;text-align:center;text-decoration:none;">Edit Profile</a>
      <button class="btn secondary" id="logoutBtn" data-i18n="logout">Logout</button>
    </div>
  </main>

  <script src="/static/js/app.js"></script>
  <script>
    renderNav("settings");
    document.getElementById("language").value = getLanguage();
    document.getElementById("language").addEventListener("change", (e) => setLanguage(e.target.value));
    document.getElementById("logoutBtn").addEventListener("click", logout);
  </script>
</body>
</html>
