name: kisaan_dost
description: Kisaan Dost — Pakistan's crop-risk assistant. Decisions, not data.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management (RULES.md §2.2)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Network (RULES.md §2.2 — dio with interceptors for JWT refresh)
  dio: ^5.7.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Navigation + deep links (alert → farm screen)
  go_router: ^14.6.2

  # Storage
  flutter_secure_storage: ^9.2.2

  # UI (low-bandwidth friendly)
  cached_network_image: ^3.4.1
  fl_chart: ^0.69.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Push
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
